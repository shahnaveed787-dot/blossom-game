<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img" aria-label="blossom word finder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9f5"/>
      <stop offset="0.5" stop-color="#ffe3ef"/>
      <stop offset="1" stop-color="#e7efff"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb3"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff5c8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="680" height="680" rx="36" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="48" fill="#ffcc4d" opacity="0.28"/>
  <circle cx="580" cy="560" r="72" fill="#7c5cff" opacity="0.12"/>
  <circle cx="610" cy="120" r="34" fill="#ff8fb3" opacity="0.22"/>

  <g transform="translate(250 300)" filter="url(#soft)">
    <circle cx="90" cy="90" r="118" fill="none" stroke="#ff5c8a" stroke-width="2" stroke-dasharray="8 10" opacity="0.25"/>
    <g fill="url(#petal)">
      <ellipse cx="90" cy="12" rx="34" ry="48"/>
      <ellipse cx="90" cy="12" rx="34" ry="48" transform="rotate(60 90 90)"/>
      <ellipse cx="90" cy="12" rx="34" ry="48" transform="rotate(120 90 90)"/>
      <ellipse cx="90" cy="12" rx="34" ry="48" transform="rotate(180 90 90)"/>
      <ellipse cx="90" cy="12" rx="34" ry="48" transform="rotate(240 90 90)"/>
      <ellipse cx="90" cy="12" rx="34" ry="48" transform="rotate(300 90 90)"/>
    </g>
    <g font-family="Fredoka,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="90" y="22">A</text>
      <text x="158" y="58" transform="rotate(60 90 90)">B</text>
      <text x="158" y="58" transform="rotate(120 90 90)">C</text>
      <text x="90" y="22" transform="rotate(180 90 90)">D</text>
      <text x="22" y="58" transform="rotate(240 90 90)">E</text>
      <text x="22" y="58" transform="rotate(300 90 90)">F</text>
    </g>
    <circle cx="90" cy="90" r="44" fill="url(#center)" stroke="#ff5c8a" stroke-width="3"/>
    <text x="90" y="104" font-family="Fredoka,Segoe UI,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#e63e73">G</text>
  </g>

  <g transform="translate(430 170)">
    <rect width="190" height="340" rx="22" fill="#fff" stroke="#f0e4ec" stroke-width="2"/>
    <rect x="18" y="18" width="154" height="36" rx="18" fill="#ffe3ef"/>
    <text x="95" y="42" font-family="Fredoka,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e63e73">Valid words</text>
    <g font-family="Fredoka,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#22143a">
      <rect x="18" y="68" width="58" height="30" rx="15" fill="#e7efff"/>
      <text x="47" y="88" text-anchor="middle">cage</text>
      <rect x="84" y="68" width="68" height="30" rx="15" fill="#e7efff"/>
      <text x="118" y="88" text-anchor="middle">badge</text>
      <rect x="18" y="108" width="72" height="30" rx="15" fill="#e7efff"/>
      <text x="54" y="128" text-anchor="middle">edged</text>
      <rect x="98" y="108" width="74" height="30" rx="15" fill="#e7efff"/>
      <text x="135" y="128" text-anchor="middle">gaged</text>
      <rect x="18" y="148" width="88" height="30" rx="15" fill="#e7efff"/>
      <text x="62" y="168" text-anchor="middle">bagged</text>
    </g>
    <rect x="18" y="198" width="154" height="44" rx="22" fill="#fff6dc" stroke="#ff5c8a" stroke-width="2"/>
    <text x="95" y="226" font-family="Fredoka,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#e63e73">cabbage - Pangram</text>
    <rect x="18" y="262" width="154" height="52" rx="16" fill="#ff5c8a"/>
    <text x="95" y="294" font-family="Fredoka,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Find Words</text>
  </g>

  <text x="340" y="620" font-family="Fredoka,Segoe UI,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#22143a">Blossom Word Finder</text>
  <text x="340" y="652" font-family="Fredoka,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#5b5470">Enter letters - get every valid word</text>
</svg>
