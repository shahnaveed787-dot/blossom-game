<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Blossom Game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="0.55" stop-color="#ffeef6"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb3"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="60" fill="#ffcc4d" opacity="0.35"/>
  <circle cx="1080" cy="520" r="90" fill="#38bdf8" opacity="0.25"/>
  <circle cx="1120" cy="90" r="40" fill="#34d399" opacity="0.35"/>
  <g transform="translate(900 315)">
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-95" rx="52" ry="78"/>
      <ellipse cx="0" cy="-95" rx="52" ry="78" transform="rotate(72)"/>
      <ellipse cx="0" cy="-95" rx="52" ry="78" transform="rotate(144)"/>
      <ellipse cx="0" cy="-95" rx="52" ry="78" transform="rotate(216)"/>
      <ellipse cx="0" cy="-95" rx="52" ry="78" transform="rotate(288)"/>
    </g>
    <circle r="52" fill="#ffcc4d"/>
    <text x="0" y="20" font-family="Fredoka,system-ui,sans-serif" font-size="60" font-weight="700" text-anchor="middle" fill="#7a3b1d">B</text>
  </g>
  <g transform="translate(760 130)">
    <g fill="url(#petal2)" opacity="0.9">
      <ellipse cx="0" cy="-34" rx="18" ry="28"/>
      <ellipse cx="0" cy="-34" rx="18" ry="28" transform="rotate(72)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="28" transform="rotate(144)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="28" transform="rotate(216)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="28" transform="rotate(288)"/>
