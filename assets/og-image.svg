    <text x="145" y="47" font-family="Fredoka,system-ui,sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#fff">Play Now</text>
  </g>
  <g font-family="Fredoka,system-ui,sans-serif" font-size="24" font-weight="500" fill="#4b4560">
